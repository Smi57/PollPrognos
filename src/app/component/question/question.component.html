<div class="question-card">
  <h2>{{ question.title | uppercase }}</h2>
  <a routerLink="/surveys">Back</a>
  <!--<img [src]="question.imgUrl" [alt]="question.title" width="750" height="500">-->
  <h3 *ngFor="let propositionData of propositionDatas">
    <!--<button>Victoire pour cette equipe ?</button><a>&nbsp;&nbsp;&nbsp;</a>-->
    <Div class="button-card" [ngClass]="{
         validated: propositionData.Choice.trim() === 'Equipe GAGNANTE',
         unvalidated: propositionData.Choice.trim() === 'Equipe PERDANTE'}">
      <button (click)="onClic(propositionData.ID)">{{ propositionData.Choice }}</button><a>&nbsp;&nbsp;&nbsp;</a>
      <span><img [src]="propositionData.Val02" width="20" height="15"></span>
      <a>&nbsp;&nbsp;{{&nbsp; propositionData.Val01 | uppercase }}</a>
    </Div>
  </h3>
  <br>
</div>
